<div class="grid grid-cols-1 md:grid-cols-2 gap-8">

<input class="w-full bg-surface-container-lowest border border-outline-variant focus:border-primary-fixed text-on-surface p-4 font-label-mono text-label-mono outline-none transition-all" placeholder="ENTER IDENTITY" type="text"/>
</div>
<div class="space-y-2">

</div>
</div>

</div>
